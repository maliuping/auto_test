[pytest]
markers =
    require_driver(name): test requires a kernel driver
    dpu: tests related to DPU reset and register verification
    based_reg: test depend on register
    single: single mode
    hard_reset: hard reset test
    soft_reset: soft reset test
    interface: interface test
    spec: spec test
    format: pixel format test
    mipi_format: mipi pixel format test
    wb_layer_func: write back layer pre process test
    rich_layer_func: verify the chroma interpolation function during YUV-to-RGB conversion
    simple_layer_func: verify the simple layer pre process
    z_order_func: verify the z-order function
    crc_64bit_func: verify the dpu dou 64-bit CRC function
    exception_interrupt: verify the dpu exception interrupt function
    flip_func: verify the hflip and vflip function
    qchannel_func: verify the qchannel function
    pixel_alpha_func: verify the pixel alpha function
    pixel_global_alpha_func: verify the pixel global alpha function

    subsys: test related to vo subsystem
    based_reg: test depend on register
    scenario: dpu to panel scenario test
    rst: test related to vo subsys crg, por reset
    intf: test related to vo subsys interface
    test: test related to vo subsys crc, vpg, dpu&dsi polarity
    mipi_format: mipi pixel format test
    intr: test related to vo subsys intr
    display: test related to vo subsys display